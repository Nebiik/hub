name: Upozornění
on:
  schedule:
    - cron: "7,22,37,52 5-10 * * *"
    - cron: "7,22,37,52 18-21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Co poslat (ručně se pošle hned)"
        type: choice
        options:
          - morning
          - evening
          - auto
        default: morning
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save firebase-admin@12 nodemailer@6
      - run: node notify.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'auto' }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}
