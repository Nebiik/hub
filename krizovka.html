<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Křížovka</title><link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#3a4fd7">
<style>
:root{--ck:#dfe6f3;--ckt:#121c2b;--ce:#b8c1d1}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ck:#2b3a5c;--ckt:#e8edf5;--ce:#1c2432}}
:root[data-theme="dark"]{--ck:#2b3a5c;--ckt:#e8edf5;--ce:#1c2432}
[hidden]{display:none!important}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
#ttl{font:700 16px var(--f);text-align:center}
.cb{min-height:44px;padding:9px 12px;border-radius:12px;background:var(--hl);font-size:15px;margin-bottom:10px}
#gr{display:grid;grid-template-columns:repeat(var(--w),minmax(0,1fr));gap:2px;background:#7d8aa0;border:2px solid #7d8aa0;border-radius:8px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.k{aspect-ratio:1;position:relative;display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden}
.k.l{background:var(--card);color:var(--tx);cursor:pointer;font:700 clamp(18px,6vw,28px) var(--f)}
.k.l.wd{background:var(--hl)}
.k.l.sel{background:#ffd966;color:#121c2b}
.k.l.bad{color:#d9453b}
.k.l.tj{box-shadow:inset 0 0 0 2px #c23a74}
.tn{position:absolute;top:1px;left:3px;font:700 clamp(7px,2vw,10px) system-ui;color:#c23a74}
.k.c{background:var(--ck);color:var(--ckt);flex-direction:column;font:500 clamp(6.5px,2.05vw,10px)/1.1 system-ui;text-align:center}
.ct{flex:1;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:1px 2px;cursor:pointer;word-break:break-word}
.ct+.ct{border-top:1px solid #7d8aa0}
.k.e{background:var(--ce)}
#tj{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;justify-content:center}
.tb{width:36px;border:2px solid #c23a74;border-radius:8px;text-align:center;padding:2px 0}
.tb small{display:block;font-size:10px;color:#c23a74;line-height:1}
.tb b{display:block;font:700 22px/1.2 var(--f);min-height:26px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns .nb{padding:9px 12px;font-size:14px}
#dn{margin-top:12px;padding:10px 12px;border-radius:12px;background:#2a9d6f;color:#fff;font-weight:700;text-align:center}
#hi{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px}
</style></head>
<body><div class="wrap" style="max-width:560px">
<header><a href="index.html">‹ HUB</a><h1>Křížovka</h1></header><div id="msg"></div>
<section class="card" style="padding:12px">
<div class="top"><button class="nb" id="pv" type="button" aria-label="Předchozí křížovka">‹</button><div id="ttl"></div><button class="nb" id="nx" type="button" aria-label="Další křížovka">›</button></div>
<div class="cb" id="cl"></div>
<div id="gr"></div>
<div id="tj"></div>
<div id="dn" hidden></div>
<div class="btns"><button class="nb" id="ck" type="button">Zkontrolovat</button><button class="nb" id="rv" type="button">Odhalit písmeno</button><button class="nb" id="rs" type="button">Smazat vše</button></div>
<div class="hint" id="st" style="margin-top:8px;color:var(--mut);font-size:13px"></div>
</section>
</div>
<input id="hi" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" aria-label="Psaní do křížovky">
<script type="module">
import{psync,pput,ymd,dn}from"./common.js";
import{KRIZ}from"./krizovky.js";
const $=i=>document.getElementById(i);
const base=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,""),isL=ch=>ch!=="#"&&ch!=="·";
const todayIdx=dn(ymd(new Date()))%KRIZ.length;
let cur=todayIdx,P,W,H,S=[],CS=[],V=[],sel=-1,dir="r",bad=new Set(),DB={},loaded=-1,tm=null,cellEl=[];
const solAt=i=>P.g[Math.floor(i/W)][i%W];
const isDone=()=>P.g.every((row,r)=>[...row].every((ch,c)=>!isL(ch)||V[r*W+c]===ch));
function build(){P=KRIZ[cur];W=P.w;H=P.h;S=[];CS=Array.from({length:W*H},()=>({}));V=Array(W*H).fill("");sel=-1;bad=new Set();
P.c.forEach(([r,c,d,t])=>{const cells=[];let rr=d==="r"?r:r+1,cc=d==="r"?c+1:c;while(rr<H&&cc<W&&isL(P.g[rr][cc])){cells.push(rr*W+cc);if(d==="r")cc++;else rr++}
const i=S.length;S.push({d,t,cells,ci:r*W+c});cells.forEach(x=>CS[x][d]=i)});
const gr=$("gr");gr.style.setProperty("--w",W);gr.innerHTML="";cellEl=[];
const tn={};P.t.forEach(([r,c],k)=>tn[r*W+c]=k+1);
for(let r=0;r<H;r++)for(let c=0;c<W;c++){const i=r*W+c,ch=P.g[r][c],d=document.createElement("div");
if(ch==="#"){d.className="k c";S.forEach((s,si)=>{if(s.ci===i){const t=document.createElement("div");t.className="ct";t.textContent=s.t+" "+(s.d==="r"?"→":"↓");t.onclick=e=>{e.stopPropagation();pickSlot(si)};d.append(t)}})}
else if(ch==="·")d.className="k e";
else{d.className="k l";const v=document.createElement("span");v.className="v";d.append(v);if(tn[i]){d.classList.add("tj");const n=document.createElement("span");n.className="tn";n.textContent=tn[i];d.append(n)}d.onclick=()=>tapCell(i)}
gr.append(d);cellEl[i]=d}
const tb=$("tj");tb.innerHTML="";P.t.forEach((_,k)=>{const b=document.createElement("div");b.className="tb";b.innerHTML="<small>"+(k+1)+"</small><b></b>";tb.append(b)});
$("st").textContent=""}
const act=()=>{if(sel<0)return null;const o=CS[sel];let k=o[dir];if(k==null){const od=dir==="r"?"d":"r";if(o[od]==null)return null;dir=od;k=o[od]}return S[k]};
function update(){const a=act(),ac=new Set(a?a.cells:[]),done=isDone();
cellEl.forEach((d,i)=>{if(!d.classList.contains("l"))return;d.classList.toggle("sel",i===sel);d.classList.toggle("wd",ac.has(i)&&i!==sel);d.classList.toggle("bad",bad.has(i));d.querySelector(".v").textContent=V[i]});
$("cl").textContent=a?(a.d==="r"?"→ ":"↓ ")+a.t+" ("+a.cells.length+")":"Klepni na políčko a piš. Tajenka se skládá z políček s čísly.";
[...$("tj").children].forEach((b,k)=>{const[r,c]=P.t[k];b.lastChild.textContent=V[r*W+c]||""});
$("dn").hidden=!done;if(done)$("dn").textContent="Hotovo! Tajenka: "+P.p+" 🎉";
$("ttl").textContent="Křížovka č. "+(cur+1)+(cur===todayIdx?" · dnešní":"")+(done||(DB["p"+cur]&&DB["p"+cur].ok)?" ✓":"")}
function focusIn(){const h=$("hi");h.value=" ";h.focus({preventScroll:true});try{h.setSelectionRange(1,1)}catch(z){}}
function tapCell(i){const o=CS[i];if(sel===i&&o.r!=null&&o.d!=null)dir=dir==="r"?"d":"r";else{sel=i;if(o[dir]==null)dir=dir==="r"?"d":"r"}focusIn();update()}
function pickSlot(si){const s=S[si];dir=s.d;sel=s.cells.find(x=>!V[x]);if(sel==null)sel=s.cells[0];focusIn();update()}
function save(){clearTimeout(tm);tm=setTimeout(flush,600)}
function flush(){clearTimeout(tm);tm=null;pput("xw",{id:"p"+cur,g:V.map(x=>x||".").join(""),ok:isDone()})}
function typeCh(ch){ch=ch.normalize("NFC").toLocaleUpperCase("cs");if(!/^\p{L}$/u.test(ch)||sel<0)return;const sol=solAt(sel);V[sel]=base(ch)===base(sol)?sol:ch;bad.delete(sel);
const a=act();if(a){const k=a.cells.indexOf(sel);if(k<a.cells.length-1)sel=a.cells[k+1]}save();update()}
function back(){if(sel<0)return;if(V[sel]){V[sel]="";bad.delete(sel)}else{const a=act(),k=a?a.cells.indexOf(sel):-1;if(k>0){sel=a.cells[k-1];V[sel]="";bad.delete(sel)}}save();update()}
function move(dr,dc){if(sel<0)return;let r=Math.floor(sel/W)+dr,c=sel%W+dc;while(r>=0&&r<H&&c>=0&&c<W){if(isL(P.g[r][c])){sel=r*W+c;dir=dr?"d":"r";update();return}r+=dr;c+=dc}}
const hi=$("hi");
hi.addEventListener("beforeinput",e=>{if(e.inputType==="deleteContentBackward"){e.preventDefault();back()}else if(e.inputType==="insertText"&&e.data){e.preventDefault();for(const ch of e.data)typeCh(ch)}});
hi.addEventListener("input",()=>{const v=hi.value.replace(/ /g,"");if(v)for(const ch of v)typeCh(ch);hi.value=" "});
hi.addEventListener("keydown",e=>{if(e.key==="Backspace"){e.preventDefault();back();return}const m={ArrowRight:[0,1],ArrowLeft:[0,-1],ArrowDown:[1,0],ArrowUp:[-1,0]}[e.key];if(m){e.preventDefault();move(m[0],m[1])}});
function load(){loaded=cur;const d=DB["p"+cur];if(d&&typeof d.g==="string"){const a=[...d.g];V=Array.from({length:W*H},(_,i)=>a[i]&&a[i]!=="."&&isL(solAt(i))?a[i]:"")}update()}
const go=n=>{if(tm)flush();cur=(cur+n+KRIZ.length)%KRIZ.length;build();load()};
$("pv").onclick=()=>go(-1);$("nx").onclick=()=>go(1);
$("ck").onclick=()=>{bad=new Set();let w=0,e=0;P.g.forEach((row,r)=>[...row].forEach((ch,c)=>{const i=r*W+c;if(!isL(ch))return;if(!V[i])e++;else if(V[i]!==ch){bad.add(i);w++}}));
$("st").textContent=w?"Chybných políček: "+w+(e?", prázdných: "+e:"")+".":(e?"Zatím žádná chyba, zbývá doplnit "+e+" políček.":"Vše správně!");update()};
$("rv").onclick=()=>{if(sel<0){$("st").textContent="Nejdřív klepni na políčko.";return}V[sel]=solAt(sel);bad.delete(sel);save();update()};
$("rs").onclick=()=>{if(!confirm("Smazat všechna písmena v této křížovce?"))return;V=Array(W*H).fill("");bad=new Set();save();update()};
document.addEventListener("visibilitychange",()=>{if(document.hidden&&tm)flush()});
build();update();
psync("xw",d=>{DB={};d.forEach(x=>DB[x.id]=x);if(loaded!==cur)load();else update()});
</script></body></html>
