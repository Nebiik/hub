<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Kalendář</title><link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#3a4fd7">
<style>
.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}@media(max-width:720px){.grid{grid-template-columns:1fr}}
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.bar h2{font-size:17px;margin:0;text-transform:capitalize}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dow div{text-align:center;font-size:12px;color:var(--mut)}
.d{aspect-ratio:1;border:1px solid var(--br);border-radius:10px;background:transparent;padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:14px}
.d.out{opacity:.4}.d.wk{background:rgba(128,128,128,.12)}.d.wk>span:first-child{color:var(--mut)}.d.hol{background:rgba(214,69,69,.16);border-color:rgba(214,69,69,.45)}.d.hol>span:first-child{color:var(--red);font-weight:700}.d.today{border-color:var(--ac);font-weight:700}.d.sel{background:var(--hl);border-color:var(--ac)}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--mut)}.leg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-2px;border:1px solid var(--br)}
h3{font-size:15px;margin:0 0 8px}.w{color:var(--mut);font-size:13px;min-width:70px}
.ow-me{background:var(--m)}.ow-ot{background:var(--b)}.ow-na{background:var(--mut)}
details.card summary{cursor:pointer;color:var(--mut);font-size:14px}details.card[open] summary{margin-bottom:12px}.tl{display:grid;gap:10px}.tl select{padding:8px;border:1px solid var(--br);border-radius:12px;background:var(--bg)}.opt{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
</style></head>
<body><div class="wrap">
<header><a href="index.html">‹ HUB</a><h1>Kalendář</h1></header><div id="msg"></div>
<div class="grid">
<section class="card">
<div class="bar"><button class="nb" id="prev" aria-label="Předchozí měsíc">‹</button><h2 id="mt"></h2><button class="nb" id="next" aria-label="Další měsíc">›</button></div>
<div class="dow"><div>Po</div><div>Út</div><div>St</div><div>Čt</div><div>Pá</div><div>So</div><div>Ne</div></div>
<div class="days" id="days"></div>
<div class="leg"><span><i></i>pracovní den</span><span><i style="background:rgba(128,128,128,.12)"></i>víkend</span><span><i style="background:rgba(214,69,69,.16);border-color:rgba(214,69,69,.45)"></i>státní svátek (volno)</span><span><i style="background:var(--m);border-radius:50%"></i>moje</span><span><i style="background:var(--b);border-radius:50%"></i>druhého</span><span><i style="background:var(--mut);border-radius:50%"></i>bez přiřazení</span></div>
</section>
<aside>
<div class="card"><h3 id="seld"></h3><div id="hn" class="empty"></div><div id="nd" class="empty"></div><div id="list"></div>
<form id="f"><input id="title" placeholder="Nová událost" required maxlength="80"><input id="date" type="date" required>
<div class="row"><input id="time" type="time"><select id="type"><option value="meet">Schůzka</option><option value="bday">Narozeniny (každý rok)</option><option value="nday">Svátek (každý rok)</option><option value="other">Jiné</option></select></div>
<div class="row"><select id="rep"><option value="">Neopakovat</option><option value="d">Každý den</option><option value="w">Každý týden</option><option value="m">Každý měsíc</option><option value="y">Každý rok</option></select><select id="own"><option value="me">Moje</option><option value="ot">Druhého</option></select></div>
<button class="add" type="submit" id="sb">Přidat událost</button><button class="nb" type="button" id="cancel" hidden>Zrušit úpravu</button></form></div>
<div style="height:16px"></div>
<div class="card"><h3>Nejbližších 30 dní</h3><div id="up"></div></div>
</aside></div>
<details class="card" style="margin-top:16px"><summary>Nástroje</summary>
<div class="tl"><b>Import z kalendáře (.ics)</b>
<input type="file" id="ics" accept=".ics,text/calendar" multiple>
<label class="opt"><input type="checkbox" id="skp" checked> přeskočit soukromé události</label>
<label class="opt">Čí události to jsou <select id="iown"><option value="me">Moje</option><option value="ot" selected>Druhého</option></select></label>
<div id="pv" class="empty"></div><button class="add" id="go" hidden>Importovat</button></div></details>
</div>
<script type="module">
import{sync,put,del,hols,ymd,me,occ}from"./common.js";
import{nameDay}from"./names.js";
const $=i=>document.getElementById(i),T=["meet","bday","nday","other"];
let E=[],today=new Date(),view=new Date(today.getFullYear(),today.getMonth(),1),sel=ymd(today),editId=null;
const evOn=s=>E.filter(e=>occ(e,s)).sort((a,b)=>(a.time||"")<(b.time||"")?-1:1);
const hol=s=>hols(+s.slice(0,4))[s];
let uid="";me.then(u=>{uid=u;render()});
const isMine=e=>e.owner?(e.owner[0]==="~"?e.owner.slice(1)!==uid:e.owner===uid):null,oc=e=>"ow-"+(isMine(e)===true?"me":isMine(e)===false?"ot":"na");
const fmt=(s,o)=>new Date(s+"T12:00:00").toLocaleDateString("cs-CZ",o);
const mk=(t,c,x)=>{const n=document.createElement(t);n.className=c;if(x!=null)n.textContent=x;return n};
function item(e,s,full){const d=mk("div","ev");d.append(mk("i","dot "+oc(e)),mk("span","w",(full?fmt(s,{weekday:"short",day:"numeric",month:"numeric"}):(e.time||"celý den"))+(e.rep?" ↻":"")));const t=mk("span","",(e.type==="bday"?"🎂 ":e.type==="nday"?"🎉 ":"")+e.title);t.style.flex=1;d.append(t);
if(!full)[["Upravit","✎",()=>start(e)],["Smazat","×",()=>{if(editId===e.id)stop();del("events",e.id)}]].forEach(([a,ic,fn])=>{const b=mk("button","x",ic);b.title=a;b.onclick=fn;d.append(b)});return d}
function render(){
$("mt").textContent=view.toLocaleDateString("cs-CZ",{month:"long",year:"numeric"});
const g=$("days");g.innerHTML="";const off=(view.getDay()+6)%7,st=new Date(view.getFullYear(),view.getMonth(),1-off),ts=ymd(today);
for(let i=0;i<42;i++){const d=new Date(st.getFullYear(),st.getMonth(),st.getDate()+i),s=ymd(d),b=mk("button","d"+(d.getMonth()!==view.getMonth()?" out":"")+(s===ts?" today":"")+(s===sel?" sel":"")+(hol(s)?" hol":d.getDay()%6==0?" wk":""));
const ty=[...new Set(evOn(s).map(oc))];
b.innerHTML=`<span>${d.getDate()}</span><span class="dots">${ty.map(t=>`<i class="dot ${t}"></i>`).join("")}</span>`;
b.onclick=()=>{sel=s;render()};g.append(b)}
$("seld").textContent=fmt(sel,{weekday:"long",day:"numeric",month:"long"});
const hn=hol(sel),wd=new Date(sel+"T12:00:00").getDay();$("hn").textContent=hn?"Státní svátek, volno: "+hn:wd%6==0?"Víkend, volno":"";$("hn").style.color=hn?"var(--red)":"";const nn=nameDay(+sel.slice(5,7),+sel.slice(8,10));$("nd").textContent=nn?"Svátek má: "+nn:"";
const l=$("list");l.innerHTML="";const es=evOn(sel);if(es.length)es.forEach(e=>l.append(item(e,sel)));else l.innerHTML='<div class="empty">Nic naplánováno.</div>';
const u=$("up");u.innerHTML="";let n=0;for(let k=0;k<30;k++){const s=ymd(new Date(today.getFullYear(),today.getMonth(),today.getDate()+k));evOn(s).forEach(e=>{u.append(item(e,s,1));n++})}
if(!n)u.innerHTML='<div class="empty">Zatím nic.</div>';
if(!editId)$("date").value=sel}
function start(e){editId=e.id;$("title").value=e.title;$("time").value=e.time||"";$("type").value=e.type;$("date").value=e.date;$("rep").value=e.rep||"";$("own").value=isMine(e)===false?"ot":"me";$("sb").textContent="Uložit změny";$("cancel").hidden=false;$("title").focus()}
function stop(){editId=null;$("f").reset();$("sb").textContent="Přidat událost";$("cancel").hidden=true;render()}
let pend=[],sk={};
const bump=k=>sk[k]=(sk[k]||0)+1,un=v=>v.replace(/\\n/gi," ").replace(/\\([,;\\])/g,"$1"),hash=x=>{let h=5381;for(const c of x)h=(h*33^c.charCodeAt(0))>>>0;return h.toString(36)+x.length.toString(36)};
function fin(c){
if(!c.DTSTART||!c.SUMMARY){bump("bez data nebo názvu");return}
if(c["RECURRENCE-ID"]){bump("upravená výjimka z opakování");return}
if(c.STATUS&&/CANCELLED/i.test(c.STATUS)){bump("zrušené");return}
if($("skp").checked&&c.CLASS&&/PRIVATE|CONFIDENTIAL/i.test(c.CLASS)){bump("soukromé");return}
const v=c.DTSTART,m=v.match(/^(\d{4})(\d\d)(\d\d)(?:T(\d\d)(\d\d)(\d\d)?(Z)?)?$/);
if(!m){bump("nečitelné datum");return}
let d=m[1]+"-"+m[2]+"-"+m[3],t="";
if(m[4]){if(m[7]){const x=new Date(Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5]));d=ymd(x);t=String(x.getHours()).padStart(2,"0")+":"+String(x.getMinutes()).padStart(2,"0")}else t=m[4]+":"+m[5]}
let rep="",until="";
if(c.RRULE){const r={};c.RRULE.split(";").forEach(x=>{const[a,b]=x.split("=");r[a]=b});
const F={DAILY:"d",WEEKLY:"w",MONTHLY:"m",YEARLY:"y"}[r.FREQ];
if(!F||(r.INTERVAL&&r.INTERVAL!=="1")||r.BYSETPOS||(F==="m"&&r.BYDAY)||(F==="w"&&r.BYDAY&&r.BYDAY.includes(","))){bump("složité opakování");return}
rep=F;
if(r.UNTIL){const u=r.UNTIL.match(/^(\d{4})(\d\d)(\d\d)/);if(u)until=u[1]+"-"+u[2]+"-"+u[3]}
else if(r.COUNT){const n=+r.COUNT-1,b=new Date(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10));if(F==="d")b.setDate(b.getDate()+n);if(F==="w")b.setDate(b.getDate()+7*n);if(F==="m")b.setMonth(b.getMonth()+n);if(F==="y")b.setFullYear(b.getFullYear()+n);until=ymd(b)}}
pend.push({uid:c.UID||v+c.SUMMARY,date:d,time:t,title:un(c.SUMMARY).slice(0,80),rep,until})}
function parse(txt){let c=null;txt.replace(/\r?\n[ \t]/g,"").split(/\r?\n/).forEach(l=>{if(l==="BEGIN:VEVENT"){c={};return}if(l==="END:VEVENT"){if(c)fin(c);c=null;return}if(!c)return;const i=l.indexOf(":");if(i<0)return;const k=l.slice(0,i).split(";")[0].toUpperCase();if(!(k in c))c[k]=l.slice(i+1)})}
$("ics").onchange=async()=>{pend=[];sk={};for(const f of $("ics").files)parse(await f.text());
const sx=Object.entries(sk).map(([k,v])=>v+"× "+k).join(", ");
$("pv").textContent=(pend.length?"Nalezeno "+pend.length+" událostí ("+pend.filter(e=>e.rep).length+" opakujících se).":"V souboru se nic nenašlo.")+(sx?" Přeskočeno: "+sx+".":"");$("go").hidden=!pend.length};
$("go").onclick=async()=>{const o=$("iown").value==="me"?uid:"~"+uid;$("go").disabled=true;let n=0;
for(let i=0;i<pend.length;i+=25){await Promise.all(pend.slice(i,i+25).map(e=>put("events",{id:"i"+hash(e.uid),date:e.date,time:e.time,title:e.title,type:"other",owner:o,rep:e.rep,until:e.until})));n=Math.min(i+25,pend.length);$("pv").textContent="Přeneseno "+n+" z "+pend.length+"…"}
$("pv").textContent="Hotovo, přeneseno "+n+" událostí.";$("go").disabled=false;$("go").hidden=true;$("ics").value="";pend=[]};
$("cancel").onclick=stop;
$("prev").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};
$("next").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};
$("f").onsubmit=x=>{x.preventDefault();const t=$("title").value.trim(),ds=$("date").value||sel;if(!t)return;
const ty=$("type").value,old=E.find(q=>q.id===editId),rp=["bday","nday"].includes(ty)?"y":$("rep").value;
put("events",{id:editId||Date.now()+""+Math.floor(Math.random()*1000),date:ds,time:$("time").value,title:t,type:ty,owner:$("own").value==="me"?uid:"~"+uid,rep:rp,until:old&&old.rep===rp?(old.until||""):""});
sel=ds;view=new Date(+ds.slice(0,4),+ds.slice(5,7)-1,1);stop()};
render();
sync("events",d=>{E=d.map(e=>({id:e.id,date:String(e.date||""),time:String(e.time||""),title:String(e.title||""),type:T.includes(e.type)?e.type:"other",owner:String(e.owner||""),rep:["d","w","m","y"].includes(e.rep)?e.rep:"",until:/^\d{4}-\d\d-\d\d$/.test(e.until)?e.until:""})).filter(e=>/^\d{4}-\d\d-\d\d$/.test(e.date));render()});
</script></body></html>
